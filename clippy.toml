# Acoustic propagation natively takes 9+ physical params (source/receiver geometry,
# distances, corrections) — bundling them into a struct just to satisfy the lint adds
# indirection without clarity. 13 = the largest existing arg count
# (source-reader add_v6_aircraft_to_result), so today's signatures pass while a future
# 14-arg fn still warns.
#
# One file at the repo root covers every engine crate: clippy walks up from each
# crate's CARGO_MANIFEST_DIR (still the member directory under the engine
# workspace) to the filesystem root looking for clippy.toml.
too-many-arguments-threshold = 13
