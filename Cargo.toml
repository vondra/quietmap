# One workspace: physics kernels, tile formats, builders, the popup and the map's data layers.
# Build with `cargo build --release`; binaries land in target/release/.
[workspace]
resolver = "3"
members = ["tiles", "physics", "build", "popup", "raster", "paint", "paint-gpu"]

[workspace.package]
edition = "2024"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"
