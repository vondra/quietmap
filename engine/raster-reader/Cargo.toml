[package]
name = "raster-reader"
version = "0.1.0"
edition = "2021"
description = "Native-lattice z9 raster publication and strict mmap sampling"

[lib]
name = "raster_reader"
path = "src/lib.rs"

[dependencies]
grid = { path = "../grid" }
memmap2 = "0.9"
noise-compute = { path = "../noise-compute" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
