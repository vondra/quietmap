[package]
name = "osm-extract"
version = "0.1.0"
edition = "2021"

[dependencies]
osmpbf = "0.3"
arrow = { version = "54", features = ["ipc"] }
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
serde_json = "1"
grid = { path = "../grid" }
square-store = { path = "../square-store" }
arrow-batching = { path = "../arrow-batching" }

[dev-dependencies]
# Only the test-only converter example reads the retired SQLite store.
rusqlite = { version = "0.37", features = ["bundled"] }

[[bin]]
name = "osm-extract"
path = "src/main.rs"
