[package]
name = "osm-to-h3r4"
version = "0.1.0"
edition = "2021"

[dependencies]
osmpbf = "0.3"
h3o = "0.7"
arrow = { version = "54", features = ["ipc"] }
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
noise-compute = { path = "../noise-compute" }
arrow-batching = { path = "../arrow-batching" }

[[bin]]
name = "osm-to-h3r4"
path = "src/main.rs"
