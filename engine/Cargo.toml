# One workspace for the nine engine crates. Rebuild with
# `cargo build --release --manifest-path engine/Cargo.toml`; binaries land
# in engine/target/release/.
[workspace]
resolver = "2"
members = [
    "aircraft-extract",
    "arrow-batching",
    "noise-compute",
    "noise-gpu",
    "osm-extract",
    "raster-reader",
    "relevant-source-gpu",
    "source-reader",
    "tile-painter",
]

# Member [profile.release] tables are ignored in a workspace. Keep the
# production opt-level / thin LTO here so the NAPI addon and paint bins
# do not silently drop to Cargo's default release profile.
[profile.release]
opt-level = 3
lto = "thin"
