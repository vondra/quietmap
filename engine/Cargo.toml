# One workspace for the engine crates. Rebuild with
# `cargo build --release --manifest-path engine/Cargo.toml`; binaries land
# in engine/target/release/.
[workspace]
resolver = "2"
members = [
    "grid",
]

# Member [profile.release] tables are ignored in a workspace. Keep the
# production opt-level / thin LTO here so future paint bins do not silently
# drop to Cargo's default release profile.
[profile.release]
opt-level = 3
lto = "thin"
