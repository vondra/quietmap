[package]
name = "arrow-batching"
version = "0.1.0"
edition = "2021"
description = "Spatially-batched arrow format shared by extract writers (osm-extract, aircraft-extract) and the popup reader (source-reader)"

[lib]
name = "arrow_batching"
path = "src/lib.rs"

[dependencies]
# default-features off: source-reader disables them too, and a bare "54"
# would drag arrow-csv/arrow-json into every dependent's lockfile.
arrow = { version = "54", default-features = false }
