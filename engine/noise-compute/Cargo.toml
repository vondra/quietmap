[package]
name = "noise-compute"
version = "0.1.0"
edition = "2021"
description = "Pure Rust noise computation engine — CNOSSOS-EU emission + ISO 9613-2 propagation"

# This is a LIBRARY crate — no I/O, no napi, no files.
# Used by source-reader (popup) and tile-painter (batch).
[lib]
name = "noise_compute"
path = "src/lib.rs"

# Validation fixture for the CNOSSOS screening fix-pack (synthetic scenes,
# stdout TSV only — the library itself stays I/O-free).
[[bin]]
name = "screening_fixture"
path = "src/bin/screening_fixture.rs"

# CPU-only step-3 mechanism census. Reads frozen pair/candidate JSONL on stdin
# and emits deterministic C/N/Q distributions through the landed H0 reducer.
[[bin]]
name = "h0-mechanism-census"
path = "src/bin/h0_mechanism_census.rs"

[[bin]]
name = "verify-h0-production-selection"
path = "src/bin/verify_h0_production_selection.rs"
required-features = ["h0-production-selection"]

[features]
# Build-time numerical authority for the selected H0 line model. The feature is
# intentionally unusable until the reviewed record exists and verifies.
h0-production-selection = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
h3o = "0.7"
# SIMD for propagate_variants 8-band inner loop (stable, AVX2/AVX-512 with scalar fallback)
wide = "0.7"
# Popup segment loops: parallel per-segment evaluation with a deterministic
# ordered reduce (compute/roads.rs, compute/railways.rs). Values are
# bit-identical at any pool size; rayon only moves the work.
rayon = "1"

[dev-dependencies]
# For unit tests
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
