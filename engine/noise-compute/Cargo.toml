[package]
name = "noise-compute"
version = "0.1.0"
edition = "2021"
description = "Noise computation engine — CNOSSOS-EU emission + ISO 9613-2 propagation"

[lib]
name = "noise_compute"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grid = { path = "../grid" }
wide = "0.7"
rayon = "1"

[dev-dependencies]
approx = "0.5"
tempfile = "3"
