<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="quietmap.org">
  <!-- Organic blob (deliberately irregular, not a regular polygon) filled with
       a true radial gradient built from the SAME stops as the map's heatmap
       ramp (frontend/src/lib/heatmap-palette.ts) — quiet (white, "0 dB") at
       the center where the 0 sits, escalating outward through the palette to
       loud at the edge. The logo is quietmap.org's own idea in miniature: a quiet
       center found amid rising noise, not a source radiating outward. -->
  <defs>
    <radialGradient id="g" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#A0BABF"/>
      <stop offset="0.36" stop-color="#B8D6D1"/>
      <stop offset="0.44" stop-color="#CEE4CC"/>
      <stop offset="0.52" stop-color="#E2F2BF"/>
      <stop offset="0.60" stop-color="#F3C683"/>
      <stop offset="0.68" stop-color="#E87E4D"/>
      <stop offset="0.76" stop-color="#CD463E"/>
      <stop offset="0.84" stop-color="#A11A4D"/>
      <stop offset="0.92" stop-color="#75085C"/>
      <stop offset="1" stop-color="#430A4A"/>
    </radialGradient>
  </defs>
